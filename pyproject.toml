[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hhcap"
version = "0.1.0"
description = "Captador de horas extras: gate de Claude Code fuera de horario y registro de marcas GeoVictoria"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
hhcap = "hhcap.cli:main"

[tool.setuptools]
packages = ["hhcap"]

[tool.setuptools.package-data]
hhcap = ["tray/*.ps1"]
